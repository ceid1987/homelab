---
# Non-secret variavles

target_user: carl

#   k3s:      k3s --version
#   kubeseal: kubeseal --version
k3s_version: "v1.35.5+k3s1"
kubeseal_version: "0.37.0"

# Github
repo_url: "https://github.com/carleid-homelab/homelab.git"
repo_branch: "main"

# Cluster
kubeconfig: "/etc/rancher/k3s/k3s.yaml"
namespaces:
  - argocd
  - apps
  - monitoring

# Upstream manifests
# Pinned so that re-running the playbook reproduces the running cluster rather
# than upgrading it as a side effect. Bump deliberately.
argocd_version: "v3.4.3"
argocd_manifest: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
# Release tags carry a v prefix, the container image tag does not: the running
# image reports 0.37.0 while the release asset lives under v0.37.0.
sealed_secrets_version: "v0.37.0"
sealed_secrets_manifest: "https://github.com/bitnami-labs/sealed-secrets/releases/download/{{ sealed_secrets_version }}/controller.yaml"

# Hetzner Object Storage
hetzner_s3_endpoint: "nbg1.your-objectstorage.com"
hetzner_s3_region: "nbg1"
hetzner_bucket: "homelab-carleid"
