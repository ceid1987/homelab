# Read by the scmProvider generator in appset.yaml. Without it the generator
# falls back to anonymous GitHub API calls, which are rate limited to 60/hour
# and will not sustain the scan interval.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-scm-token
  namespace: argocd
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: github-scm-token
      namespace: argocd
