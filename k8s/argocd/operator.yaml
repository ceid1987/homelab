apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/carleid-homelab/homelab-operator
    # CI renders the kustomize output here with the image pinned to the commit
    # that built it. main carries no dist/ directory.
    path: dist
    targetRevision: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
