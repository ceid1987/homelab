apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # Pinned: "*" let ArgoCD auto-upgrade the whole monitoring stack on every
      # chart release. Bump deliberately via commit.
      targetRevision: "88.1.5"
      helm:
        valueFiles:
        - $values/k8s/monitoring/grafana/values.yaml
    - repoURL: https://github.com/carleid-homelab/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
