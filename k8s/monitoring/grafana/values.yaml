grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  service:
    annotations:
      # homelab-operator derives the cloudflared ingress list from this
      # annotation, the same way the applications declare their hostnames.
      homelab.carleid.dev/domain: grafana.carleid.dev
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
  grafana.ini:
    server:
      root_url: https://grafana.carleid.dev
    auth.anonymous:
      enabled: false

# Drop bracketed-IPv6 targets before scraping.
# The metrics_path relabeling is the chart default
# these lists replaces the defaults entirely.
kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__address__]
        regex: '\[.*'
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__address__]
        regex: '\[.*'
    probesRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__address__]
        regex: '\[.*'

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"

alertmanager:
  enabled: true
